[workspace]
members = [
    "crates/core",
    "crates/dem",
    "crates/ortho",
    "crates/io",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Federico Gómez <fjgomezc@eafit.edu.co>", "Zenith Contributors"]
description = "High-performance 2.5D direct ray-casting photogrammetry engine for tactical UAV thermal and RGB orthomosaics"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
