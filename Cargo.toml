[workspace]
members = [
    "crates/core",
    "crates/dem",
    "crates/ortho",
    "crates/io",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["Federico Gómez <fjgomezc@eafit.edu.co>", "Zenith Contributors"]
description = "High-performance direct 2.5D aerial photogrammetry and orthorectification engine in Rust"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
